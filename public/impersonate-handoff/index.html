<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دخول المكتب…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ef;
        color: #1b1c1a;
        font-family: Cairo, Tahoma, sans-serif;
      }
      .card {
        width: min(420px, 92vw);
        background: #fff;
        border: 1px solid #eae8e4;
        border-radius: 12px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border-radius: 999px;
        border: 3px solid rgba(156, 100, 2, 0.25);
        border-top-color: #9c6402;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      p {
        margin: 8px 0 0;
        font-size: 12px;
        color: #737067;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="msg">جاري فتح لوحة المكتب…</h1>
      <p>لن يُطلب منك إدخال البريد أو كلمة المرور.</p>
    </div>
    <script>
      (function () {
        var SESSION_KEY = "doussary_auth_session";
        var USER_KEY = "doussary_auth";
        var params = new URLSearchParams(window.location.search);
        var encoded = params.get("s") || "";
        var next = params.get("next") || "https://law.elmoroj.com/lawyer/";
        var msg = document.getElementById("msg");

        function fail(text) {
          msg.textContent = text;
          setTimeout(function () {
            window.location.replace("https://law.elmoroj.com/lawyer/login");
          }, 1200);
        }

        function decodeSession(raw) {
          try {
            var padded = raw.replace(/-/g, "+").replace(/_/g, "/");
            while (padded.length % 4) padded += "=";
            var binary = atob(padded);
            var bytes = Uint8Array.from(binary, function (c) {
              return c.charCodeAt(0);
            });
            return JSON.parse(new TextDecoder().decode(bytes));
          } catch (e) {
            return null;
          }
        }

        var session = encoded ? decodeSession(encoded) : null;
        if (!session || !session.token) {
          fail("رابط الدخول غير صالح أو منتهي.");
          return;
        }

        try {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
          localStorage.setItem(
            USER_KEY,
            JSON.stringify({
              id: session.id,
              user: {
                id: session.id,
                name: session.name,
                email: session.email,
                role: session.role,
              },
            })
          );
        } catch (e) {
          fail("تعذر حفظ جلسة الدخول في المتصفح.");
          return;
        }

        window.history.replaceState({}, "", window.location.pathname);
        window.location.replace(next.indexOf("/") === next.length - 1 ? next : next + "/");
      })();
    </script>
  </body>
</html>
